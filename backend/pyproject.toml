[project]
name = "swing-coach-backend"
version = "0.1.0"
description = "SwingCoach MVP backend — AI-powered tennis swing analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "tslearn>=0.6.0",
    "anthropic>=0.34.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.35.0",
    "rq>=1.16.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
