services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/app:/app/app  # live reload in dev
    environment:
      - REDIS_URL=redis://redis:6379

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    command: python run_worker.py
    environment:
      - REDIS_URL=redis://redis:6379

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
